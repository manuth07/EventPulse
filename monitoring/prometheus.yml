  #   static_configs:
  #     - targets: ['eventpulse-gateway-dev-xyz.azurewebsites.net:443']
  #
  # - job_name: 'eventpulse-azure-identity'
  #   scheme: https
  #   metrics_path: '/metrics'
  #   static_configs:
  #     - targets: ['eventpulse-identity-dev-xyz.azurewebsites.net:443']
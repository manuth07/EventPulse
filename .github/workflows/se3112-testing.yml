name: SE3112 Microservice Testing Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - se3112/test-automation

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality & Metrics - SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage

      - name: Restore dependencies
        run: dotnet restore backend/EventPulse.Backend.sln

      - name: Begin SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"${{ vars.SONAR_PROJECT_KEY }}" \
            /o:"${{ vars.SONAR_ORGANIZATION }}" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml" \
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs,**/*.ps1" \
            /d:sonar.cpd.exclusions="**/Migrations/**" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/TestResults/**,**/coveragereport/**,tests/performance-jmeter/report/**,tests/performance-jmeter/report-*/**,**/node_modules/**,**/dist/**"

      - name: Build backend solution
        run: dotnet build backend/EventPulse.Backend.sln --configuration Release --no-restore

      - name: Run unit tests with code coverage
        run: |
          dotnet-coverage collect \
            "dotnet test backend/EventPulse.Backend.sln --configuration Release --no-build --verbosity normal" \
            -f xml \
            -o coverage.xml

      - name: End SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner end \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  unit-testing:
    name: Unit Testing & Mocking - xUnit + Moq
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/EventPulse.Backend.sln

      - name: Run unit tests (xUnit + Moq)
        run: >
          dotnet test backend/services/booking-service/tests/EventPulse.BookingService.Tests/EventPulse.BookingService.Tests.csproj
          --configuration Release --no-restore
          --filter "Category=SE3112-Unit"
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory ./TestResults/unit

      - name: Run unit tests - Payment refunds (xUnit + Moq)
        run: >
          dotnet test backend/services/payment-service/tests/EventPulse.PaymentService.Tests/EventPulse.PaymentService.Tests.csproj
          --configuration Release --no-restore
          --filter "Category=SE3112-Unit"
          --logger "trx;LogFileName=payment-unit-tests.trx"
          --results-directory ./TestResults/unit


      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults/unit/*.trx

  selenium-e2e:
    name: UI / E2E Testing - Selenium WebDriver
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore Selenium test dependencies
        run: dotnet restore tests/e2e-selenium/EventPulse.E2E.Tests.csproj

      - name: Build Selenium test project
        run: dotnet build tests/e2e-selenium/EventPulse.E2E.Tests.csproj --configuration Release --no-restore

      - name: Run Selenium E2E Tests (Headless Chrome)
        env:
          EVENTPULSE_BASE_URL: ${{ vars.EVENTPULSE_BASE_URL || 'http://localhost:5173' }}
          TEST_CUSTOMER_EMAIL: ${{ secrets.TEST_CUSTOMER_EMAIL || 'nimal.test01@example.com' }}
          TEST_CUSTOMER_PASSWORD: ${{ secrets.TEST_CUSTOMER_PASSWORD || 'SecurePass123!' }}
          SELENIUM_SCREENSHOT_DIR: ${{ github.workspace }}/TestResults/selenium/screenshots
        run: >
          dotnet test tests/e2e-selenium/EventPulse.E2E.Tests.csproj
          --configuration Release --no-restore
          --filter "FullyQualifiedName~LoginTests|FullyQualifiedName~BrowseEventsTests|FullyQualifiedName~CustomerBookingHistoryTests"
          --logger "trx;LogFileName=selenium-results.trx"
          --results-directory ./TestResults/selenium

      - name: Upload Selenium TRX Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-results
          path: TestResults/selenium/*.trx

      - name: Upload Selenium Failure Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-failure-screenshots
          path: TestResults/selenium/screenshots/*.png
          if-no-files-found: ignore
  
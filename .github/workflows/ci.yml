name: EventPulse CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/EventPulse.Backend.sln

      - name: Build backend solution
        run: dotnet build backend/EventPulse.Backend.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test backend/EventPulse.Backend.sln --configuration Release --no-build --verbosity normal

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: 'http://localhost:7000'
          VITE_GOOGLE_CLIENT_ID: 'placeholder-google-client-id'

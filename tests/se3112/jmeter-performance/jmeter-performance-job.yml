# Handoff template. Add this job under jobs: in .github/workflows/se3112-testing.yml.
  jmeter-performance:
    name: Load & Performance Testing - JMeter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      OUTPUT_ROOT: TestResults/jmeter/runs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verified Apache JMeter 5.6.3
        run: |
          set -euo pipefail
          archive=apache-jmeter-5.6.3.tgz
          sha512=5978a1a35edb5a7d428e270564ff49d2b1b257a65e17a759d259a9283fc17093e522fe46f474a043864aea6910683486340706d745fcdf3db1505fd71e689083
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            "https://archive.apache.org/dist/jmeter/binaries/$archive" -o "$archive"
          printf '%s  %s\n' "$sha512" "$archive" | sha512sum --check --strict
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/apache-jmeter-5.6.3/bin" >> "$GITHUB_PATH"

      - name: Build gateway and Event Service
        run: |
          dotnet build backend/gateway/src/EventPulse.Gateway -c Release
          dotnet build backend/services/event-service/src/EventPulse.EventService -c Release

      - name: Start isolated infrastructure
        run: |
          docker compose up -d postgres kafka azurite
          for attempt in {1..30}; do
            if timeout 5s docker compose exec -T postgres pg_isready -h 127.0.0.1 -U postgres \
              && timeout 5s docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server localhost:9092 --list; then
              for topic in event-submitted event-submitted-dlq booking-cancelled; do
                docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh \
                  --bootstrap-server localhost:9092 --create --if-not-exists \
                  --topic "$topic" --partitions 1 --replication-factor 1
              done
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL or Kafka failed readiness." >&2
          exit 1

      - name: Start Event Service and gateway, then run baseline
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ReverseProxy__Clusters__event_cluster__Destinations__event_service__Address: http://127.0.0.1:7102
          TARGET_PROTO: http
          TARGET_HOST: '127.0.0.1'
          TARGET_PORT: '7000'
          API_PATH: /api/events
          ALLOW_NONLOCAL: '0'
        run: |
          set -euo pipefail
          logs="$GITHUB_WORKSPACE/TestResults/jmeter/backend"
          mkdir -p "$logs"

          start_service() {
            local directory="$1" assembly="$2" port="$3"
            (
              cd "$directory"
              exec dotnet "bin/Release/net10.0/$assembly.dll" --urls "http://127.0.0.1:$port"
            ) >"$logs/$assembly.log" 2>&1 </dev/null &
            echo "$!" >> "$logs/processes.pid"
          }

          start_service backend/services/event-service/src/EventPulse.EventService EventPulse.EventService 7102
          start_service backend/gateway/src/EventPulse.Gateway EventPulse.Gateway 7000
          bash tests/se3112/jmeter-performance/run-tests.sh baseline

      - name: Capture logs and clean up isolated infrastructure
        if: always()
        run: |
          set -euo pipefail
          logs=TestResults/jmeter/backend
          mkdir -p "$logs"
          if [[ -f "$logs/processes.pid" ]]; then
            while IFS= read -r pid; do
              kill "$pid" 2>/dev/null || true
            done < "$logs/processes.pid"
          fi
          docker compose logs --no-color postgres kafka azurite > "$logs/compose.log" 2>&1 || true
          docker compose down --volumes --remove-orphans

      - name: Upload available JMeter and backend artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-baseline
          path: |
            TestResults/jmeter/runs/
            TestResults/jmeter/backend/*.log
          if-no-files-found: warn
